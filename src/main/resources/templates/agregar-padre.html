<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Padre | Control de Asistencia</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Arial,sans-serif;background:#eef3f8;color:#172033}.app{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#1769c2;color:#fff;padding:24px 15px;display:flex;flex-direction:column;z-index:10}.logo{display:flex;align-items:center;gap:10px;padding:8px 18px 30px;font-size:26px;font-weight:800}.menu{display:flex;flex-direction:column;gap:6px}.menu a{color:#fff;text-decoration:none;padding:13px 17px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:14px}.menu a:hover,.menu a.active{background:#42a5f5}.bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.25);padding-top:15px}.active-user{font-size:13px;padding:0 10px 12px}.logout{width:100%;border:0;background:#e63950;color:#fff;padding:11px;border-radius:8px;font-weight:700;cursor:pointer}.main{margin-left:250px;width:calc(100% - 250px);padding:34px;max-width:1550px}.header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.header h1{font-size:30px}.header p{color:#64748b;margin-top:5px}.system{background:#fff;padding:12px 17px;border-radius:11px;box-shadow:0 4px 15px rgba(0,0,0,.07);color:#1769c2}.panel{background:#fff;border-radius:15px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.panel-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.btn{display:inline-block;background:#1769c2;color:#fff;text-decoration:none;border:0;padding:10px 15px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}.btn:hover{background:#105aa9}.btn.secondary{background:#64748b}.btn.danger{background:#dc3545}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{background:#eaf4fc;color:#47627c;padding:13px;text-align:left;font-size:12px}td{padding:13px 12px;border-bottom:1px solid #e5eaf0;font-size:13px}tbody tr:hover{background:#f8fafc}.actions{display:flex;gap:7px;flex-wrap:wrap}.small-btn{padding:7px 10px;border-radius:7px;border:0;text-decoration:none;color:#fff;background:#1769c2;font-size:12px;font-weight:700;cursor:pointer}.small-btn.edit{background:#f59e0b}.small-btn.delete{background:#dc3545}.badge{display:inline-block;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700}.present{background:#dcfce7;color:#166534}.absent{background:#fee2e2;color:#991b1b}.justified{background:#fef3c7;color:#92400e}.other{background:#e2e8f0;color:#475569}.empty{text-align:center;padding:45px;color:#64748b}.alert{padding:12px 15px;border-radius:9px;margin-bottom:18px}.alert.success{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857}.alert.error{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.form-panel{max-width:900px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.group{margin-bottom:4px}.group.full{grid-column:1/-1}.group label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}.group input,.group select,.group textarea{width:100%;padding:12px 14px;border:1px solid #d3dce6;border-radius:9px;font:inherit;background:#fff}.group input:focus,.group select:focus,.group textarea:focus{outline:0;border-color:#1769c2;box-shadow:0 0 0 3px rgba(23,105,194,.1)}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.info{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:12px;color:#64748b;font-size:13px;margin-bottom:20px}@media(max-width:900px){.main{padding:22px}.grid{grid-template-columns:1fr}.group.full{grid-column:auto}}@media(max-width:700px){.app{display:block}.sidebar{position:static;width:100%;min-height:auto}.main{margin:0;width:100%;padding:20px}.header{align-items:flex-start;flex-direction:column}.logo{padding-bottom:20px}}</style></head><body><div class="app"><aside class="sidebar"><div class="logo">📚 <span>Asistencia</span></div><nav class="menu"><a href="/home">🏠 <span>Inicio</span></a><a href="/asistencia">📋 <span>Asistencias</span></a><a href="/padres" class="active">👨‍👩‍👧 <span>Padres</span></a><a href="/reuniones">📅 <span>Reuniones</span></a><a href="/asistencia/agregar">📝 <span>Agregar asistencia</span></a><a href="/usuarios">👥 <span>Usuarios</span></a></nav><div class="bottom"><div class="active-user">👤 Usuario activo: <strong th:text="${username}">admin</strong></div><form action="/logout" method="post"><button class="logout" type="submit">🚪 Cerrar sesión</button></form></div></aside><main class="main"><header class="header"><div><h1 th:text="${padre.idPadre == null ? 'Agregar padre' : 'Editar padre'}">Agregar padre</h1><p>Completa la información del padre o encargado.</p></div><div class="system">👨‍👩‍👧 Datos del padre</div></header><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><div class="info">Los datos se guardarán directamente en la tabla <strong>padres</strong> de PostgreSQL.</div><form action="/padres/guardar" method="post"><input type="hidden" name="idPadre" th:value="${padre.idPadre}"><div class="grid"><div class="group full"><label for="nombreCompleto">Nombre completo *</label><input id="nombreCompleto" name="nombreCompleto" th:value="${padre.nombreCompleto}" required maxlength="150" placeholder="Ej. Juan Pérez López"></div><div class="group"><label for="dui">DUI</label><input id="dui" name="dui" th:value="${padre.dui}" maxlength="10" placeholder="00000000-0"></div><div class="group"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" th:value="${padre.telefono}" maxlength="20" placeholder="7000-0000"></div><div class="group"><label for="nombreEstudiante">Nombre del estudiante</label><input id="nombreEstudiante" name="nombreEstudiante" th:value="${padre.nombreEstudiante}" maxlength="150" placeholder="Nombre del estudiante"></div><div class="group"><label for="gradoSeccion">Grado / sección</label><input id="gradoSeccion" name="gradoSeccion" th:value="${padre.gradoSeccion}" maxlength="50" placeholder="Ej. 3° Desarrollo de Software A"></div></div><div class="form-actions"><a class="btn secondary" href="/padres">Cancelar</a><button class="btn" type="submit">💾 <span th:text="${padre.idPadre == null ? 'Guardar padre' : 'Actualizar padre'}">Guardar padre</span></button></div></form></section></main></div><script src="/js/configuracion-global.js"></script></body></html>
