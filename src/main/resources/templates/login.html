<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login MVC</title>

    <!-- CSS -->

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

</head>

<body>

<main class="card">

    <h1>
        Iniciar sesión
    </h1>

    <p>
        Accede a la aplicación web MVC con Spring Boot.
    </p>

    <!-- ERROR -->

    <div class="error"
         th:if="${error}"
         th:text="${error}">

    </div>

    <!-- FORM -->

    <form method="post"
          th:action="@{/login}"
          th:object="${loginModel}">

        <!-- USERNAME -->

        <label for="username">

            Usuario

        </label>

        <input id="username"
               type="text"
               th:field="*{username}"
               autocomplete="username">

        <!-- PASSWORD -->

        <label for="password">

            Contraseña

        </label>

        <input id="password"
               type="password"
               th:field="*{password}"
               autocomplete="current-password">

        <!-- BUTTON -->

        <button type="submit">

            Ingresar

        </button>

    </form>

    <!-- INFO -->

    <p class="hint">

        Control de asistencia de reuniones

    </p>

</main>

</body>

</html>
